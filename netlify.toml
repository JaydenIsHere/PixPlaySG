[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# PixPlay Learning is the homepage: send "/" to the reader's language (static pages in public/zh and public/en).
[[redirects]]
  from = "/"
  to = "/zh/"
  status = 302
  force = true
  conditions = {Language = ["zh", "zh-tw", "zh-hk", "zh-hant", "zh-cn", "zh-sg"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# React Router client-side routes (e.g. /access, /privacy-policy) have no matching
# static file on Netlify's CDN, so direct visits or refreshes 404 without this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
